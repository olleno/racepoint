<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Race Point – Alpine Skiing</title>
<meta name="description" content="FIS-poäng och penalty räknade medan tävlingen pågår.">
<!-- Gör att sidan kan läggas på hemskärmen och öppnas som en app, med
     egen ikon och utan webbläsarens ramar. Ingen app-butik inblandad. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="ikoner/apple-touch-icon.png">
<link rel="icon" href="ikoner/ikon-192.png" sizes="192x192">
<meta name="theme-color" content="#12305a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Race Point">
<style>
  :root{
    --bg:#f4f6f8; --card:#fff; --ink:#0f1419; --ink2:#3d4753; --muted:#6b7684;
    --line:#e4e8ec; --line2:#eef1f4; --accent:#0a5fbf; --accent-bg:#e8f0fb;
    --brand1:#0a4fa0; --brand2:#2fb8ef;
    --sigill:#12305a; --sigill-disk:#12305a; --sigill-ring:#12305a;
    --sigill-berg:#ffffff; --sigill-dot:#2f7fb8;
    /* en färg per FIS-gren – alpint är den som gäller på den här sidan */
    --gren-alpint:#0a5fbf; --gren-langd:#0f8a5f; --gren-backe:#6d4bd6;
    --gren-nordisk:#c2620a; --gren-freestyle:#c62a72; --gren-snowboard:#0891a8;
    --gren-masters:#4c5a6b; --gren-telemark:#7d6b23; --gren-speed:#b4213d;
    --gren-freeride:#3f6212;
    --sport:var(--gren-alpint); --sport-bg:#e8f0fb;
    --guld:#9a7209; --guld-bg:#fdf4dd; --silver:#5d6672; --silver-bg:#eef1f5;
    --brons:#96521f; --brons-bg:#fbeee2;
    --ok:#0a7a41; --ok-bg:#e6f4ec; --bad:#b03a2c; --live:#d92d20; --warn-bg:#fdf3e3;
    --live-bg:#fef4f2; --live-bg2:#fde9e6; --live-ink:#8f2018; --vantar-ink:#8a5a12;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0d1014; --card:#161a1f; --ink:#e9edf2; --ink2:#c3cad3; --muted:#8e99a6;
      --line:#252b32; --line2:#1d2228; --accent:#63a8ff; --accent-bg:#14243a;
      --brand1:#2f7fd8; --brand2:#4fd0ff;
      --sigill:#dfe7f0; --sigill-disk:#1c4a86; --sigill-ring:#5b86b8;
      --sigill-berg:#ffffff; --sigill-dot:#7cc0ee;
      --gren-alpint:#63a8ff; --gren-langd:#3fc48f; --gren-backe:#a78bfa;
      --gren-nordisk:#f0a742; --gren-freestyle:#f472b6; --gren-snowboard:#38bdd8;
      --gren-masters:#93a3b5; --gren-telemark:#cbb85a; --gren-speed:#ff6b81;
      --gren-freeride:#a3d05a;
      --sport:var(--gren-alpint); --sport-bg:#14243a;
      --guld:#e3bc4d; --guld-bg:#2b2513; --silver:#aab4c0; --silver-bg:#20262d;
      --brons:#d59462; --brons-bg:#2b1f16;
      --ok:#4ec281; --ok-bg:#12281c; --bad:#f0857a; --live:#ff5c4d; --warn-bg:#2a2213;
      --live-bg:#2a1512; --live-bg2:#361a16; --live-ink:#ff9d92; --vantar-ink:#e0b86a;
      --shadow:0 1px 3px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  /* färgremsa högst upp – byter färg med grenen, så alpint, längd och
     backhoppning känns igen direkt utan att man läser rubriken */
  body::before{content:"";display:block;height:4px;
    background:linear-gradient(90deg,var(--sport) 0%,var(--sport) 55%,var(--live) 55%,var(--live) 100%)}
  .wrap{max-width:960px;margin:0 auto;padding:20px 16px 72px}

  /* ---------- logotyp ---------- */
  .topprad{display:flex;align-items:flex-start;justify-content:space-between;
    gap:16px;margin-bottom:16px}
  .sprakval select{font:inherit;font-size:12.5px;color:var(--ink2);background:var(--card);
    border:1px solid var(--line);border-radius:8px;padding:5px 8px;cursor:pointer;
    box-shadow:var(--shadow)}
  .brand{display:inline-flex;align-items:center;gap:13px;
    text-decoration:none;color:inherit}
  .brand svg{display:block;flex:none}
  .brand .wm{line-height:1}
  .brand .wm b{display:block;font-size:20px;font-weight:700;letter-spacing:.135em;
    text-transform:uppercase;color:var(--sigill)}
  .brand .wm .rule{display:block;height:1px;margin:7px 0 6px;
    background:var(--sigill);opacity:.35}
  .brand .wm span{display:block;font-size:8.5px;font-weight:700;letter-spacing:.34em;
    text-transform:uppercase;color:var(--sport)}

  /* ---------- nedräkning till start ---------- */
  .klocka{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:13px 17px;margin-bottom:16px}
  .klocka .siffra{font-size:27px;font-weight:680;font-variant-numeric:tabular-nums;
    letter-spacing:-.02em;line-height:1.1;color:var(--accent)}
  .klocka b{display:block;font-size:12.5px;font-weight:620;letter-spacing:.02em}
  .klocka span{display:block;font-size:12.5px;color:var(--muted)}

  .lead{color:var(--muted);font-size:13.5px;margin:0 0 18px}
  .toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
  .seg{display:inline-flex;background:var(--card);border:1px solid var(--line);
    border-radius:9px;padding:2px;box-shadow:var(--shadow)}
  .seg button{border:0;background:none;color:var(--ink2);font:inherit;font-size:13px;
    padding:5px 11px;border-radius:7px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--sport);color:#fff;font-weight:600}
  .spacer{flex:1}

  /* ---------- nyheter ---------- */
  .nyheter{margin:26px 0 6px}
  .nyheter h2{font-size:12px;font-weight:620;text-transform:uppercase;
    letter-spacing:.07em;color:var(--sport);margin:0 0 10px 2px}
  .nylista{background:var(--card);border:1px solid var(--line);border-radius:12px;
    overflow:hidden;box-shadow:var(--shadow)}
  a.nyhet{display:block;padding:11px 14px;text-decoration:none;color:inherit;
    border-bottom:1px solid var(--line2);border-left:3px solid transparent}
  a.nyhet:last-child{border-bottom:0}
  a.nyhet:hover{background:var(--sport-bg);border-left-color:var(--sport)}
  a.nyhet .rub{display:block;font-weight:560;line-height:1.4}
  a.nyhet .meta{display:block;font-size:12px;color:var(--muted);margin-top:2px}

  /* ---------- pallplatser ---------- */
  td.pos span{display:inline-flex;min-width:23px;height:23px;align-items:center;
    justify-content:center;border-radius:7px;font-size:12.5px;font-weight:700;
    font-variant-numeric:tabular-nums}
  td.pos span.m1{background:var(--guld-bg);color:var(--guld)}
  td.pos span.m2{background:var(--silver-bg);color:var(--silver)}
  td.pos span.m3{background:var(--brons-bg);color:var(--brons)}

  /* skiljelinje mellan kommande och avgjorda tävlingar */
  .avdelare{display:flex;align-items:center;gap:12px;margin:30px 0 14px;
    font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.16em;
    color:var(--muted)}
  .avdelare.forst{margin-top:0}
  .avdelare::after{content:"";flex:1;height:1px;background:var(--line)}
  .daygroup{margin-bottom:22px}
  .daygroup h2{font-size:12px;font-weight:620;text-transform:uppercase;letter-spacing:.07em;
    color:var(--sport);margin:0 0 8px 0;padding-left:9px;
    border-left:3px solid var(--sport)}
  .races{background:var(--card);border:1px solid var(--line);border-radius:12px;
    overflow:hidden;box-shadow:var(--shadow)}
  a.race{display:flex;align-items:center;gap:12px;padding:11px 14px;text-decoration:none;
    color:inherit;border-bottom:1px solid var(--line2);
    border-left:3px solid transparent;transition:background .12s,border-color .12s}
  a.race:last-child{border-bottom:0}
  a.race:hover{background:var(--sport-bg);border-left-color:var(--sport)}
  /* en tävling som går i dag markeras i rött hela vägen ut i kanten */
  a.race.nu{border-left-color:var(--live);background:var(--live-bg)}
  a.race.nu:hover{background:var(--live-bg2)}
  a.race.nu .l1{color:var(--live-ink)}
  /* lopp som är över men där FIS inte publicerat något resultat */
  .race.tom{opacity:.62;cursor:default}
  .race.tom:hover{background:none;border-left-color:transparent}
  .chip.vantar{background:var(--warn-bg);color:var(--vantar-ink)}
  .flag{font-size:20px;line-height:1;width:26px;text-align:center;flex:none;
    font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
  .flag.txt{font-size:10.5px;font-weight:700;color:var(--muted)}
  /* två rader under varandra – utan detta klistrades ort och gren ihop */
  .rmain{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
  .rmain .l1{display:block;font-weight:600;letter-spacing:-.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rmain .l2{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .rside{display:flex;align-items:center;gap:7px;flex:none}
  .chip{font-size:11px;font-weight:560;padding:2px 7px;border-radius:6px;
    background:var(--line2);color:var(--muted);white-space:nowrap}
  .chip.k{background:var(--sport-bg);color:var(--sport)}
  .chip.live{background:var(--live);color:#fff;letter-spacing:.04em;
    box-shadow:0 0 0 3px var(--live-bg2)}
  .chip.ok{background:var(--ok-bg);color:var(--ok)}
  .arrow{color:var(--muted);font-size:15px}

  .back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--accent);
    text-decoration:none;margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:15px 17px;margin-bottom:14px;box-shadow:var(--shadow)}
  .card h3{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
    color:var(--sport);margin:0 0 12px;display:flex;align-items:center;gap:9px}
  .card h3::after{content:"";flex:1;height:1px;background:var(--line2)}
  .nums .n.stor{color:var(--sport)}
  .rhead{display:flex;align-items:center;gap:13px}
  .rhead .flag{font-size:26px;width:32px}
  .rhead h2{font-size:18px;font-weight:640;margin:0;letter-spacing:-.01em}
  .rhead h2 a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
  .rhead h2 a:hover{color:var(--accent);border-bottom-color:var(--accent)}
  .rhead .sub{font-size:13px;color:var(--muted)}
  .msg{font-size:13px;color:var(--ink2);background:var(--line2);border-radius:8px;
    padding:8px 11px;margin-top:11px}

  .nums{display:flex;gap:28px;flex-wrap:wrap}
  .nums .n{font-size:29px;font-weight:640;font-variant-numeric:tabular-nums;
    line-height:1.1;letter-spacing:-.02em}
  .nums small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);margin-top:2px}
  .formel{font-size:12.5px;color:var(--muted);margin:12px 0 0;line-height:1.6}

  .tblwrap{overflow-x:auto;margin:0 -17px;padding:0 17px}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
  th{font-size:11px;font-weight:620;text-transform:uppercase;letter-spacing:.05em;
    color:var(--muted);border-bottom-color:var(--line)}
  tr:last-child td{border-bottom:0}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  td.pos{color:var(--muted);width:1%}
  td.name a{color:inherit;text-decoration:none;border-bottom:1px solid transparent;cursor:pointer}
  td.name a:hover{color:var(--accent);border-bottom-color:var(--accent)}
  .fam{font-weight:560} .giv{color:var(--muted);font-weight:400}
  .up{color:var(--ok);font-weight:560} .down{color:var(--bad)} .muted{color:var(--muted)}
  .warn{background:var(--warn-bg);border-radius:9px;padding:10px 12px;font-size:13px;
    color:var(--ink2);margin-bottom:14px}
  .err{color:var(--bad)}
  .status{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
  .dot.on{background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}

  .lankar{display:flex;flex-wrap:wrap;gap:8px}
  .lankar a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;
    font-size:13px;color:var(--ink2);background:var(--line2);border-radius:8px;
    padding:6px 11px}
  .lankar a:hover{background:var(--accent-bg);color:var(--accent)}
  .tom{font-size:13px;color:var(--muted);line-height:1.65}
  .foot{font-size:12px;color:var(--muted);margin-top:26px;line-height:1.7}

  /* ---------- väderpanel ---------- */
  details.vader summary{list-style:none;cursor:pointer;display:flex;align-items:center;
    gap:12px;user-select:none}
  details.vader summary::-webkit-details-marker{display:none}
  details.vader summary .ikon{font-size:26px;line-height:1;
    font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
  details.vader summary .sum{min-width:0;flex:1}
  details.vader summary .sum b{display:block;font-size:15px;font-weight:600}
  details.vader summary .sum span{display:block;font-size:12.5px;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  details.vader summary .pil{flex:none;font-size:10.5px;font-weight:620;
    text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
  details.vader summary .pil::after{content:" ▾";font-size:11px}
  details.vader[open] summary .pil::after{content:" ▴"}
  details.vader[open] summary{margin-bottom:14px;padding-bottom:12px;
    border-bottom:1px solid var(--line2)}
  details.vader[open] summary .sum span{display:none}
  .wnu{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:4px}
  .wnu .ikon{font-size:38px;line-height:1;
    font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
  .wnu .grad{font-size:34px;font-weight:660;font-variant-numeric:tabular-nums;
    letter-spacing:-.02em;line-height:1.05}
  .wnu .txt{font-size:13px;color:var(--muted);margin-top:3px}
  .wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));
    gap:10px 14px;margin-top:14px}
  .wgrid div b{display:block;font-size:10.5px;font-weight:620;text-transform:uppercase;
    letter-spacing:.06em;color:var(--muted)}
  .wgrid div span{font-size:15px;font-variant-numeric:tabular-nums}
  .wchart{margin-top:16px;overflow-x:auto}
  .wchart svg{display:block;min-width:520px;width:100%;height:132px}

  /* ---------- sändning och kameror ---------- */
  .ram{position:relative;width:100%;padding-top:56.25%;border-radius:10px;
    overflow:hidden;background:#000;margin-bottom:10px}
  .ram iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .cam{display:block;width:100%;border-radius:10px;margin-bottom:8px;background:var(--line2)}
  .medianamn{font-size:12.5px;color:var(--muted);margin:0 0 10px}

  /* ---------- sponsorer på startsidan ---------- */
  /* vit panel – sponsorernas logotyper får synas i sina egna färger */
  .sponsorer{margin-top:26px;padding:16px 20px 18px;border-radius:14px;
    background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);
    border-top:3px solid var(--sport)}
  .sponsorer h4{font-size:10.5px;font-weight:620;text-transform:uppercase;
    letter-spacing:.14em;color:var(--muted);margin:0 0 14px}
  .sponsorer .rad{display:flex;flex-wrap:wrap;gap:16px 34px;align-items:center}
  .sponsorer a{display:inline-flex;align-items:center;gap:7px;text-decoration:none;
    color:var(--ink);font-size:15px;font-weight:640;letter-spacing:-.01em;
    transition:transform .15s}
  .sponsorer a:hover{transform:translateY(-1px)}
  .sponsorer img{width:auto;display:block}
  .sponsorer img.marke{height:16px}
  .sponsorer .namn{white-space:nowrap}

  /* ---------- lägg till på hemskärmen ---------- */
  .install{position:fixed;left:12px;right:12px;z-index:60;
    bottom:calc(12px + env(safe-area-inset-bottom));
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 6px 24px rgba(16,24,40,.16), 0 2px 6px rgba(16,24,40,.08);
    padding:13px 14px;display:flex;align-items:flex-start;gap:12px;
    animation:upp .28s ease-out}
  @media (prefers-reduced-motion:reduce){.install{animation:none}}
  @keyframes upp{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
  .install svg.marke{flex:none;margin-top:1px}
  .install .txt{flex:1;min-width:0}
  .install .txt b{display:block;font-size:14.5px;font-weight:620;line-height:1.3}
  .install .txt span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
  .install .knappar{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
  .install button{font:inherit;font-size:13.5px;font-weight:560;border-radius:9px;
    padding:8px 15px;cursor:pointer;border:1px solid var(--line);
    background:var(--card);color:var(--ink2)}
  .install button.ja{background:var(--sigill-disk);color:#fff;border-color:transparent}
  .install .delaikon{display:inline-block;vertical-align:-3px;margin:0 2px}

  /* ---------- mobil ---------- */
  @media (max-width:640px){
    .wrap{padding:14px 12px 60px}
    .brand svg{width:42px;height:39px}
    .brand .wm b{font-size:18px}
    .card{padding:13px 13px;border-radius:11px}
    .tblwrap{margin:0 -13px;padding:0 13px}
    th,td{padding:8px 6px;font-size:13.5px}
    .doljsmal{display:none}
    .nums{gap:18px}
    .nums .n{font-size:25px}
    .rhead h2{font-size:16px}
    .wnu .grad{font-size:30px}
    .wchart svg{min-width:430px}
    a.race{padding:12px 12px;gap:10px}
    .rside .chip:not(.live):not(.k){display:none}
    /* långa namn får radbrytas i stället för att tvinga fram sidled-scroll */
    td.name{white-space:normal;min-width:104px}
    .klocka{gap:12px;padding:12px 13px}
    .klocka .siffra{font-size:24px}
  }
  @media (max-width:400px){
    .rmain .l2{font-size:12px}
    .doljsmycketsmal{display:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topprad">
  <a class="brand" href="#" aria-label="Race Point, alpint">
    <!-- Sigill: en mållinje med tre stigande staplar på – race och points.
         Medvetet utan berg eller portar, så samma märke fungerar för längd,
         skicross, backhoppning och allt annat FIS håller på med. Symmetriskt
         och enfärgat: lika tydligt i 16 pixlar som på en tryckt rygglapp. -->
    <svg width="50" height="50" viewBox="0 0 52 52" role="img" aria-hidden="true">
      <circle cx="26" cy="26" r="25" fill="none" stroke="var(--sigill-ring)" stroke-width="1.6"/>
      <circle cx="26" cy="26" r="21" fill="var(--sigill-disk)"/>
      <path d="M12 33l7.5-11 5 7 6-9.5L38 33z" fill="var(--sigill-berg)"/>
      <rect x="12" y="35.4" width="26" height="2" rx="1" fill="var(--sigill-dot)"/>
    </svg>
    <span class="wm"><b>Race Point</b><span class="rule"></span><span>Alpine Skiing</span></span>
  </a>
  <div id="sprakval" class="sprakval"></div>
  </div>

  <div id="nedrakning"></div>
  <div id="app"></div>
  <p class="foot" id="foot"></p>
</div>

<script src="sprak.js"></script>
<script src="fis-kalender.js"></script>
<script src="fis-poangdata.js"></script>
<script src="fis-profiler.js"></script>
<script src="fis-media.js"></script>
<script src="fis-forbund.js"></script>
<script src="fis-nyheter.js"></script>
<script src="fis-arkiv.js"></script>
<script>
/* ============ 0. Språk ============
   Engelska är alltid utgångsläget – hela sajten möter besökaren på samma
   språk, oavsett var i världen hen sitter. Först när någon själv väljer ett
   annat språk i väljaren byts det, och då kommer valet ihåg. */
const SPARAT='rp-sprak';
function valjSprak(){
  try{
    const v=localStorage.getItem(SPARAT);

/* ============ 1. FIS eget dataformat (PHP-serialiserat) ============ */
function unserialize(s){
  let i=0;
  function parse(){
    const t=s[i];
    if(t==='N'){i+=2;return null;}
    if(t==='i'){i+=2;const j=s.indexOf(';',i);const v=parseInt(s.slice(i,j));i=j+1;return v;}
    if(t==='d'){i+=2;const j=s.indexOf(';',i);const v=parseFloat(s.slice(i,j));i=j+1;return v;}
    if(t==='b'){i+=2;const v=s[i]==='1';i+=2;return v;}
    if(t==='s'){i+=2;const j=s.indexOf(':',i);const n=parseInt(s.slice(i,j));i=j+2;
                const v=s.substr(i,n);i+=n+2;return v;}
    if(t==='a'){i+=2;const j=s.indexOf(':',i);const n=parseInt(s.slice(i,j));i=j+2;
                const o={};for(let k=0;k<n;k++){const key=parse();o[key]=parse();}i++;return o;}
    throw new Error('Oväntat tecken "'+t+'"');
  }
  return parse();
}
const HOSTS=['https://sys1.novius.net','https://d27.novius.net'];
async function grab(dir,fil){
  let sist;
  for(const h of HOSTS){

      if(!r.ok){sist=new Error('status '+r.status);continue;}

}

const R2=v=>Math.round(v*100+1e-9)/100;
// FIS skriver grennamnen på engelska i kalendern; vi kortar dem till koden
// och slår upp namnet på besökarens språk.
const GRENKOD={'Downhill':'DH','Slalom':'SL','Giant Slalom':'GS','Super G':'SG',
               'Alpine Combined':'AC','Team Combined':'AC'};
const TID=v=>{if(v==null)return null;
  const n=parseInt(String(v).split(':')[0],10);return (isNaN(n)||n<=0)?null:n;};

function analysera(d){
  const info=d.raceinfodetail||{};
  const gren=info.discipline, kon=info.gender, kat=info.category;
  const rad=(window.FIS_CFG.dis||[]).find(x=>x[0]===gren&&x[1]===kon);
  if(!rad) return {fel:T('okandGren',{g:gren+' '+kon})};
  const F=rad[2], MAX=rad[3];
  const niva=window.FIS_CFG.lvl[kat];
  const tillagg=rad[4+(niva==null?3:niva)];
  const minPen=window.FIS_CFG.min[kat]||0;

  const sl=d.startlist&&d.startlist['0']?d.startlist['0']['0']:null;
  const res=d.result?d.result['0']:null;
  if(!sl) return {fel:T('ingenStartlista')};

  const akare={};
  for(const k in (d.racers||{})){const r=d.racers[k];
    if(r) akare[r[0]]={efter:r[1]||'',forn:r[2]||'',nat:r[3]||''};}

  const akt=Object.keys(sl).map(Number).sort((a,b)=>a-b);
  const sista=akt[akt.length-1];

  const poang=f=>{const p=window.FIS_POINTS[String(f)];if(!p)return null;
                  const v=p[gren];return (v==null||isNaN(v))?null:v;};
  const ordning=f=>{const v=poang(f);return v==null?Infinity:v;};
  const varde=f=>Math.min(ordning(f),MAX);

  const startande=[];
  for(const i in sl[akt[0]]){const e=sl[akt[0]][i];if(!e)continue;
    if(String(e['2']).toLowerCase().startsWith('dns'))continue;
    startande.push(e['0']);}

  /* Varje åkare har en rad med mellantider och sist måltiden:
     {0: 30280, 1: 52960, 2: 78160}. Tidigare läste vi plats 0, alltså
     FÖRSTA mellantiden — därav tider på trettio sekunder i ett störtlopp.
     Måltiden ligger på den högsta platsen, och hur många mellantider banan
     har varierar. Vi räknar därför fram platsen ur dem som faktiskt gått i
     mål: den högsta plats någon av dem har ett värde på är målplatsen. */
  let malPlats=0;
  for(const i in sl[sista]){
    const e=sl[sista][i];
    if(!e||e['2']!=='finish') continue;
    const r=res&&res[sista]?res[sista][i]:null;
    if(!r) continue;
    for(const k in r) if(r[k]!=null && +k>malPlats) malPlats=+k;
  }

  const klara=[], kvar=[];
  for(const i in sl[sista]){
    const e=sl[sista][i];if(!e)continue;
    const r=res&&res[sista]?res[sista][i]:null;
    const t=TID(r?r[String(malPlats)]:null);
    if(e['2']==='finish'&&t) klara.push({fis:e['0'],bib:e['1'],t});
    else kvar.push({fis:e['0'],bib:e['1'],status:e['2']||''});
  }
  klara.sort((a,b)=>a.t-b.t);

  const utanPoang=startande.filter(f=>poang(f)==null).length;
  const tackning=startande.length?1-utanPoang/startande.length:0;
  const brutit=kvar.filter(x=>/dnf|dq|dsq/i.test(x.status)).length;

  let penalty=null, last=false;
  if(klara.length){
    const To=klara[0].t;
    klara.forEach((x,ix)=>{x.pos=ix+1;
      x.rp=Math.min(Math.max(R2(F*x.t/To-F),0),MAX);
      x.efter=x.t-To;});
    const tionde=klara[9]?klara[9].pos:Infinity;
    const A=klara.filter(x=>x.pos<=tionde)
      .sort((a,b)=>ordning(a.fis)-ordning(b.fis)||b.rp-a.rp).slice(0,5)
      .map(x=>({v:varde(x.fis),k:ordning(x.fis),rp:x.rp,har:poang(x.fis)!=null&&poang(x.fis)<=MAX}));
    const B=startande.slice().sort((a,b)=>ordning(a)-ordning(b)).slice(0,5).map(f=>({v:varde(f)}));
    const medPoang=A.filter(x=>x.har).length;
    const a=A.slice(); while(a.length<5)a.push({v:MAX,rp:0,har:false,k:Infinity});
    const b=B.slice(); while(b.length<5)b.push({v:MAX});
    const sA=a.reduce((s,x)=>s+x.v,0), sB=b.reduce((s,x)=>s+x.v,0), sC=a.reduce((s,x)=>s+x.rp,0);
    const P=R2((sA+sB-sC)/10+tillagg);
    let till=Math.max(P,minPen);
    if(medPoang<3) till=Math.max(till,2*MAX);
    penalty={ber:P,till,sA:R2(sA),sB:R2(sB),sC:R2(sC),tillagg,minPen,medPoang,MAX};
    // Summa B är låst från start. Penalty kan bara röra sig om någon som är
    // kvar har bättre FIS-poäng än den femte bästa av dem som redan är i mål.
    const femte=a[4]?a[4].k:Infinity;
    const kanAndras=kvar.some(x=>!/dnf|dq|dsq|dns/i.test(x.status)&&ordning(x.fis)<femte);
    last=!kanAndras;
    klara.forEach(x=>{x.nya=R2(x.rp+till);const nu=poang(x.fis);
      x.nu=nu; x.vinst=(nu==null)?null:R2(nu-x.nya);});
  }
  return {gren,kon,kat,F,MAX,akare,klara,kvar,startande,penalty,last,tackning,utanPoang,
          brutit, akt:d.runno?d.runno['1']:null, meddelande:d.message||'', info};
}

/* ---------- nedräkning till start ----------
   Starttiden från FIS är lokal tid på tävlingsorten. Vi tar ortens tidszon
   från geokodningen och räknar om till en exakt tidpunkt, så nedräkningen
   stämmer oavsett var i världen den som tittar befinner sig. */
function zonAvvikelse(tid,zon){
  const f=new Intl.DateTimeFormat('en-US',{timeZone:zon,hour12:false,
    year:'numeric',month:'2-digit',day:'2-digit',
    hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const d={}; f.formatToParts(tid).forEach(p=>d[p.type]=p.value);
  const somUtc=Date.UTC(+d.year,+d.month-1,+d.day,(+d.hour)%24,+d.minute,+d.second);
  return somUtc-tid.getTime();
}
function starttidpunkt(datum,klockslag,zon){
  if(!datum||!klockslag) return null;
  const [t,m]=klockslag.split(':').map(Number);
  const [y,mo,da]=datum.split('-').map(Number);
  const naiv=Date.UTC(y,mo-1,da,t||0,m||0,0);
  if(!zon) return new Date(naiv);
  let ms=naiv;
  for(let i=0;i<2;i++) ms=naiv-zonAvvikelse(new Date(ms),zon);
  return new Date(ms);
}
function kvarText(ms){
  const e=(window.SPRAK_ENHETER&&(window.SPRAK_ENHETER[SPR]||window.SPRAK_ENHETER.en))

  const s=Math.floor(ms/1000);
  const d=Math.floor(s/86400), t=Math.floor(s%86400/3600),
        m=Math.floor(s%3600/60), sek=s%60;
  if(d>0) return d+' '+e.d+' '+t+' '+e.t;
  if(t>0) return t+' '+e.t+' '+String(m).padStart(2,'0')+' '+e.m;
  return m+' '+e.m+' '+String(sek).padStart(2,'0')+' '+e.s;
}

/* Ritar en egen kurva över dygnet: temperatur som linje, snöfall som staplar.
   Allt ritat i sidan, inga externa bilder eller kartor som kan sluta fungera. */
function vaderKurva(h){
  if(!h||!h.time) return '';
  const nu=new Date();
  let start=h.time.findIndex(t=>new Date(t)>=new Date(nu.getTime()-3600000));
  if(start<0) start=0;
  const idx=[]; for(let i=start;i<Math.min(start+24,h.time.length);i++) idx.push(i);
  if(idx.length<4) return '';
  const T=idx.map(i=>h.temperature_2m[i]);
  const S=idx.map(i=>h.snowfall[i]||0);
  const W=idx.map(i=>h.wind_gusts_10m?h.wind_gusts_10m[i]:0);
  const B=770, H=132, vl=34, hl=8, bh=30;      // bredd, höjd, marginaler, stapelhöjd
  const yb=H-26;                                // baslinje för kurvan
  const min=Math.min(...T), max=Math.max(...T);
  const spann=(max-min)||1;
  const x=i=>vl+i*(B-vl-hl)/(idx.length-1);
  const y=v=>18+(1-(v-min)/spann)*(yb-18-bh);
  const punkter=T.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ');
  const maxSno=Math.max(0.1,...S);
  let ut='<svg viewBox="0 0 '+B+' '+H+'" preserveAspectRatio="none" role="img" '+
         'aria-label="Väder timme för timme">';
  // nollgradersstreck
  if(min<0&&max>0){
    const y0=y(0);
    ut+='<line x1="'+vl+'" y1="'+y0+'" x2="'+(B-hl)+'" y2="'+y0+
        '" stroke="currentColor" stroke-dasharray="3 4" opacity=".28"/>'+
        '<text x="4" y="'+(y0+4)+'" font-size="10" fill="currentColor" opacity=".55">0°</text>';
  }
  // snöstaplar
  S.forEach((v,i)=>{ if(v<=0)return;
    const hh=Math.max(2,(v/maxSno)*bh);
    ut+='<rect x="'+(x(i)-4)+'" y="'+(yb-hh)+'" width="8" height="'+hh+
        '" rx="2" fill="var(--brand2)" opacity=".55"/>';});
  // temperaturkurva
  ut+='<polyline points="'+punkter+'" fill="none" stroke="var(--accent)" '+
      'stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
  // klockslag och värden var tredje timme
  idx.forEach((h_i,i)=>{
    if(i%3) return;
    const kl=h.time[h_i].slice(11,16);
    ut+='<text x="'+x(i)+'" y="'+(H-6)+'" font-size="10" text-anchor="middle" '+
        'fill="currentColor" opacity=".55">'+kl+'</text>'+
        '<text x="'+x(i)+'" y="'+(y(T[i])-8)+'" font-size="10.5" text-anchor="middle" '+
        'fill="currentColor" opacity=".8">'+Math.round(T[i])+'°</text>';

      ut+='<text x="'+x(i)+'" y="14" font-size="9.5" text-anchor="middle" '+

  });
  ut+='<text x="4" y="14" font-size="9.5" fill="currentColor" opacity=".55">byar</text>';
  return ut+'</svg>';
}

const KAL=(window.FIS_KALENDER||'').split('\n').filter(Boolean).map(r=>{

});
let filterKon='', filterGren='';

/* Ritar en sponsor. Logotypen hämtas från sponsorns egen sajt; om den inte
   laddar döljs bilden och namnet i text visas i stället. Ingen tom lucka. */
function sponsorMarke(s){
  const fall="this.style.display='none';"+
             "var t=this.parentNode.querySelector('.namn');if(t)t.hidden=false;";
  let h='<a href="'+esc(s.adress)+'" target="_blank" rel="noopener sponsored nofollow">';
  if(s.marke) h+='<img class="marke" src="'+esc(s.marke)+'" alt="" '+
                 'onerror="this.style.display=\'none\'">';
  if(s.bild)  h+='<img src="'+esc(s.bild)+'" alt="'+esc(s.namn)+'" '+
                 'style="height:'+(s.hojd||20)+'px" onerror="'+fall+'">';
  h+='<span class="namn"'+(s.bild?' hidden':'')+'>'+esc(s.namn)+'</span></a>';
  return h;
}

function ritaValjare(){
  const idag=new Date().toISOString().slice(0,10);
  let lopp=KAL.filter(r=>(!filterKon||r.kon===filterKon)&&(!filterGren||r.gren===filterGren));
  // Kommande först, sedan de avgjorda – båda i stigande datumordning,
  // med en tydlig skiljelinje emellan.
  lopp.sort((a,b)=>{
    const ak=a.datum>=idag, bk=b.datum>=idag;
    if(ak!==bk) return ak?-1:1;
    return a.datum.localeCompare(b.datum);
  });
  const grenar=[...new Set(KAL.map(r=>r.gren))];
  const grenText=g=>GRENNAMN()[GRENKOD[g]]||g;
  let h='<p class="lead">'+esc(T('ingress'))+'</p>'+
        '<div class="toolbar"><div class="seg">'+
        ['','M','W'].map(v=>'<button data-kon="'+v+'" aria-pressed="'+(filterKon===v)+'">'+
          esc(v===''?T('alla'):(v==='M'?T('herrar'):T('damer')))+'</button>').join('')+'</div>'+
        '<div class="seg">'+
        ['',...grenar].map(v=>'<button data-gren="'+esc(v)+'" aria-pressed="'+(filterGren===v)+'">'+
          esc(v===''?T('allaGrenar'):grenText(v))+'</button>').join('')+'</div></div>';
  if(!lopp.length) h+='<div class="card"><p class="muted">'+esc(T('ingaTraffar'))+'</p></div>';

  let dag=null, iHistorik=false;
  if(lopp.length && lopp[0].datum>=idag)
    h+='<p class="avdelare forst">'+esc(TX('SPRAK_AVDELARE','kommande'))+'</p>';
  lopp.forEach(r=>{
    const historisk=r.datum<idag;
    if(historisk && !iHistorik){
      if(dag!==null){ h+='</div></section>'; dag=null; }
      h+='<p class="avdelare">'+esc(TX('SPRAK_AVDELARE','tidigare'))+'</p>';
      iHistorik=true;
    }
    if(r.datum!==dag){
      if(dag!==null) h+='</div></section>';
      dag=r.datum;
      h+='<section class="daygroup"><h2>'+esc(datumtext(dag))+'</h2><div class="races">';
    }
    const live=r.datum===idag;
    /* FIS tar bort livetimingen ungefär en månad efter loppet. Finns en
       färdig resultatsida i arkivet går länken dit i stället. Är loppet över
       och saknar både livetiming och resultatsida har FIS inte publicerat
       något än – då ska raden inte gå att klicka på alls, för bakom den
       finns bara ett felmeddelande. */
    const arkiverad=(window.FIS_ARKIV||{})[r.codex+'|'+r.datum];
    const passerat=r.datum<idag;
    const dodrad=passerat&&!arkiverad;
    h+=(dodrad
        ? '<div class="race tom">'
        : '<a class="race'+(live?' nu':'')+'" href="'+
          (arkiverad?esc(arkiverad):'#tavling/'+esc(r.codex))+'">')+flagga(r.nat)+
       '<span class="rmain"><span class="l1">'+esc(r.plats)+'</span>'+
       '<span class="l2">'+esc(grenText(r.gren))+' · '+
       esc(r.kon==='M'?T('konM'):T('konW'))+
       (r.tid?' · '+esc(T('startKl',{t:r.tid})):'')+'</span></span>'+
       '<span class="rside">'+(live?'<span class="chip live">'+esc(T('live'))+'</span>':'')+
       (dodrad?'<span class="chip vantar">'+esc(T('ejPublicerat'))+'</span>':'')+
       '<span class="chip k">'+esc(r.kat)+'</span>'+
       '<span class="chip">'+esc(r.codex)+'</span>'+
       (dodrad?'':'<span class="arrow">›</span>')+'</span>'+(dodrad?'</div>':'</a>');
  });
  if(dag!==null) h+='</div></section>';

  // nyheterna hämtas av nattjobbet; saknas filen visas ingenting alls
  const ny=(window.FIS_NYHETER||[]).slice(0,8);
  if(ny.length){
    h+='<section class="nyheter"><h2>'+esc(TX('SPRAK_NYHETER','rubrik'))+'</h2><div class="nylista">';
    ny.forEach(n=>{
      h+='<a class="nyhet" href="'+esc(n.lank)+'" target="_blank" rel="noopener">'+
         '<span class="rub">'+esc(n.rubrik)+'</span>'+
         '<span class="meta">'+esc(n.kalla)+(n.datum?' · '+esc(n.datum):'')+'</span></a>';
    });
    h+='</div><p class="lead" style="margin:10px 0 0">'+
       esc(TX('SPRAK_NYHETER','fot'))+'</p></section>';
  }

  const sp=window.SIDSPONSORER||[];
  if(sp.length){
    h+='<div class="sponsorer"><h4>'+esc(TX('SPRAK_SPONSOR','rubrik'))+'</h4><div class="rad">'+
       sp.filter(s=>s.adress&&/^https?:\/\//i.test(s.adress)).map(sponsorMarke).join('')+
       '</div></div>';
  }
  document.getElementById('app').innerHTML=h;
  document.querySelectorAll('[data-kon]').forEach(b=>b.onclick=()=>{filterKon=b.dataset.kon;ritaValjare();});
  document.querySelectorAll('[data-gren]').forEach(b=>b.onclick=()=>{filterGren=b.dataset.gren;ritaValjare();});
  nollstallKlocka();
}

/* ============ 8. Vy: en åkare ============ */
const TILLATNA=['instagram.com','tiktok.com','youtube.com','youtu.be','facebook.com',
  'x.com','twitter.com','strava.com','linkedin.com'];
const TYPNAMN={instagram:['Instagram','📷'],tiktok:['TikTok','🎵'],
  youtube:['YouTube','▶️'],facebook:['Facebook','👥'],
  x:['X','✕'],twitter:['X','✕'],strava:['Strava','🏃'],
  linkedin:['LinkedIn','💼'],webb:['Egen sida','🌐'],
  sponsor:['','🤝']};
function saker(adress,typ){
  try{
    const u=new URL(adress);
    if(u.protocol!=='https:'&&u.protocol!=='http:')return false;
    if(typ==='webb'||typ==='sponsor')return true;      // egna sidor tillåts
    const v=u.hostname.replace(/^www\./,'');
    return TILLATNA.some(t=>v===t||v.endsWith('.'+t));
  }catch(e){return false;}
}
/* Läser ett publicerat Google-ark. idNamn är början på id-kolumnens namn,
   t.ex. "fis" för åkarnas ark och "codex" för sändningsarket. */
async function arkCsv(url,idNamn){
  if(!url) return {};
  try{
    const txt=await (await fetch(url)).text();
    const rader=txt.split(/\r?\n/).map(r=>r.match(/("([^"]|"")*"|[^,]*)(,|$)/g)||[]);
    const rubrik=(rader[0]||[]).map(c=>c.replace(/[",]/g,'').trim().toLowerCase());
    const kol=n=>rubrik.findIndex(r=>r.indexOf(n)===0);
    const iI=kol(idNamn), iT=kol('typ'), iN=kol('namn'), iA=kol('adress'), iG=kol('godk');
    const ut={};
    rader.slice(1).forEach(c=>{
      const v=j=>j<0?'':String(c[j]||'').replace(/^"|",?$|,$/g,'').replace(/""/g,'"').trim();
      if(iG>=0 && !/^(ja|yes|x|1|sant|true)$/i.test(v(iG))) return;
      const id=v(iI).replace(/\D/g,''); if(!id) return;
      (ut[String(+id)]=ut[String(+id)]||[]).push(
        {typ:v(iT).toLowerCase(),namn:v(iN),adress:v(iA)});
    });
    return ut;
  }catch(e){ return {}; }
}
/* Åkarnas egna länkar kommer från ett publicerat Google-ark med en rad per
   åkare och en kolumn per tjänst. Arket innehåller bara godkända rader och
   bara offentliga kolumner – e-post, födelseår och målsman stannar i det
   privata svarsarket. Google levererar tabbseparerat även när man ber om
   csv, så vi klarar båda. */
const PROFILKOL=['instagram','tiktok','youtube','facebook','linkedin','strava','webb'];
/* Åkare skriver "@namn" lika ofta som hela adressen. Vi bygger adressen
   åt dem i stället för att kasta raden. */
const PROFILBAS={instagram:'https://www.instagram.com/',tiktok:'https://www.tiktok.com/@',
  youtube:'https://www.youtube.com/@',facebook:'https://www.facebook.com/',
  linkedin:'https://www.linkedin.com/in/',strava:'https://www.strava.com/athletes/'};
function heladress(typ,v){
  v=String(v||'').trim();
  if(!v) return '';
  if(/^https?:\/\//i.test(v)) return v;
  if(/^www\./i.test(v)) return 'https://'+v;
  if(/^[a-z0-9-]+\.[a-z]{2,}([/?#]|$)/i.test(v)) return 'https://'+v;
  const bas=PROFILBAS[typ];
  if(!bas) return '';
  return bas+v.replace(/^@/,'');
}
async function profilCsv(url){
  if(!url) return {};
  try{
    const txt=await (await fetch(url)).text();
    const rader=txt.split(/\r?\n/).filter(r=>r.trim());
    if(!rader.length) return {};
    /* Google levererar ibland tabb, ibland komma. Vi väljer det tecken som
       faktiskt delar filen i flest fält i stället för att gissa. */
    const prov=rader.slice(0,3).join('\n');
    const tecken=(prov.match(/\t/g)||[]).length>(prov.match(/,/g)||[]).length?'\t':',';
    /* Citattecken måste hanteras: en sponsorrad kan innehålla kommatecken. */
    const dela=r=>{
      const ut=[]; let f='', i=0, cit=false;
      while(i<r.length){
        const c=r[i];
        if(cit){
          if(c==='"'){ if(r[i+1]==='"'){f+='"';i+=2;continue;} cit=false; i++; continue; }
          f+=c; i++; continue;
        }
        if(c==='"'){ cit=true; i++; continue; }
        if(c===tecken){ ut.push(f.trim()); f=''; i++; continue; }
        f+=c; i++;
      }
      ut.push(f.trim());
      return ut;
    };
    const rubrik=dela(rader[0]).map(c=>c.toLowerCase());
    const kol=n=>rubrik.indexOf(n);
    const iF=kol('fis'); if(iF<0) return {};
    const ut={};
    rader.slice(1).forEach(r=>{
      const c=dela(r);
      const fis=String(c[iF]||'').replace(/\D/g,''); if(!fis) return;
      const lista=[];
      PROFILKOL.forEach(namn=>{
        const j=kol(namn); const a=heladress(namn, j>=0?c[j]:'');
        if(a) lista.push({typ:namn,namn:'',adress:a});
      });
      ['sponsor1','sponsor2','sponsor3'].forEach(namn=>{
        const j=kol(namn); const v=j>=0?c[j]:''; if(!v) return;
        /* "Namn – https://..." eller bara adressen */
        const m=v.match(/^(.*?)[\s–—-]+((?:https?:\/\/|www\.)\S+)$/);
        const a=heladress('webb', m?m[2]:v);
        if(a) lista.push({typ:'sponsor',namn:m?m[1].trim():'',adress:a});
      });
      if(lista.length) ut[String(+fis)]=lista;
    });
    return ut;
  }catch(e){ return {}; }
}
const hamtaArk=()=>profilCsv(window.FIS_PROFIL_ARK);
let ARK=null, MEDIAARK=null;

/* ---------- sändning och webbkameror ---------- */
function inbaddning(adress){
  try{
    const u=new URL(adress), v=u.hostname.replace(/^www\./,'');
    if(v==='youtube.com'||v==='m.youtube.com'){
      const id=u.searchParams.get('v')||(u.pathname.match(/\/(?:live|embed|shorts)\/([\w-]+)/)||[])[1];
      if(id) return 'https://www.youtube.com/embed/'+id;
    }
    if(v==='youtu.be'){const id=u.pathname.slice(1); if(id) return 'https://www.youtube.com/embed/'+id;}
    if(v==='vimeo.com'){const id=(u.pathname.match(/(\d+)/)||[])[1];
      if(id) return 'https://player.vimeo.com/video/'+id;}
    if(v==='twitch.tv'){const kanal=u.pathname.replace(/\//g,'');
      if(kanal) return 'https://player.twitch.tv/?channel='+kanal+'&parent='+location.hostname;}
    if(v==='dailymotion.com'){const id=(u.pathname.match(/video\/([\w]+)/)||[])[1];
      if(id) return 'https://www.dailymotion.com/embed/video/'+id;}
  }catch(e){}
  return null;
}
const arBild=a=>/\.(jpe?g|png|webp)(\?|$)/i.test(a||'');

async function ritaMedia(codex,plats){
  const ruta=document.getElementById('media'); if(!ruta) return;
  if(MEDIAARK===null) MEDIAARK=await arkCsv(window.FIS_MEDIA_ARK,'codex');
  const nyckel=String(+String(codex).replace(/\D/g,''));
  const poster=[...((window.FIS_MEDIA||{})[nyckel]||[]),
                ...((window.FIS_MEDIA||{})[String(codex)]||[]),
                ...((MEDIAARK||{})[nyckel]||[])]
    .filter(m=>m.adress&&/^https?:\/\//i.test(m.adress));
  if(!poster.length){
    ruta.innerHTML='<div class="card"><h3>'+esc(T('sandning'))+'</h3>'+
      '<p class="tom">'+esc(T('ingenSandning'))+'</p>'+
      '<div class="lankar" style="margin-top:10px">'+
      '<a href="https://www.youtube.com/results?search_query='+
        encodeURIComponent(plats+' ski race live')+'" target="_blank" rel="noopener">'+
        '🔎 '+esc(T('sokSandning'))+'</a>'+
      '<a href="https://www.google.com/search?q='+
        encodeURIComponent(plats+' webcam')+'" target="_blank" rel="noopener">'+
        '🎥 '+esc(T('sokKamera'))+'</a></div></div>';
    return;
  }
  let h='<div class="card"><h3>'+esc(T('sandning'))+'</h3>';
  const knappar=[];
  poster.forEach(m=>{
    const badd=inbaddning(m.adress);
    if(badd){
      h+=(m.namn?'<p class="medianamn">'+esc(m.namn)+'</p>':'')+
         '<div class="ram"><iframe src="'+esc(badd)+'" allowfullscreen '+
         'allow="autoplay; fullscreen; picture-in-picture" '+
         'referrerpolicy="no-referrer-when-downgrade" loading="lazy"></iframe></div>';
    }else if(arBild(m.adress)){
      h+=(m.namn?'<p class="medianamn">'+esc(m.namn)+'</p>':'')+
         '<img class="cam" data-cam="'+esc(m.adress)+'" src="'+esc(m.adress)+'" '+
         'alt="Webbkamera '+esc(m.namn||plats)+'" loading="lazy">';
    }else{
      knappar.push('<a href="'+esc(m.adress)+'" target="_blank" rel="noopener nofollow">'+
        (m.typ==='webbkamera'?'🎥 ':(m.typ==='webb'?'🌐 ':'▶️ '))+
        esc(m.namn||T('sandning'))+'</a>');
    }
  });
  if(knappar.length) h+='<div class="lankar">'+knappar.join('')+'</div>'+
    '<p class="formel">'+esc(T('ejInbaddad'))+'</p>';
  ruta.innerHTML=h+'</div>';
  // webbkameror är stillbilder som byts ut – ladda om dem regelbundet
  if(window.__camTimer) clearInterval(window.__camTimer);
  const bilder=[...ruta.querySelectorAll('img[data-cam]')];
  if(bilder.length) window.__camTimer=setInterval(()=>{
    bilder.forEach(b=>{b.src=b.dataset.cam+(b.dataset.cam.indexOf('?')<0?'?':'&')+'t='+Date.now();});
  },30000);
}

async function ritaAkare(fis,codex){
  nollstallKlocka();
  const app=document.getElementById('app');
  const p=window.FIS_POINTS[String(fis)]||{};
  const rank=(window.FIS_RANK||{})[String(fis)]||{};
  const bio=fisLank(fis);
  const namn=(window.__namn&&window.__namn[fis])||null;
  const nat=(window.__nat&&window.__nat[fis])||'';
  const GN=GRENNAMN();

  let h='<a class="back" href="'+(codex?'#tavling/'+esc(codex):'#')+'">'+esc(T('tillbakaKort'))+'</a>';
  h+='<div class="card"><div class="rhead">'+flagga(nat)+
     '<div><h2>'+(namn?esc(namn):'FIS-kod '+esc(fis))+'</h2>'+
     '<div class="sub">FIS-kod '+esc(fis)+(nat?' · '+esc(nat):'')+'</div></div></div></div>';

  const grenar=['DH','SL','GS','SG','AC'].filter(g=>p[g]!=null);
  if(grenar.length){
    h+='<div class="card"><h3>'+esc(T('fisPoangRubrik'))+'</h3><div class="tblwrap"><table>'+
       '<tr><th>'+esc(T('gren'))+'</th><th class="n">'+esc(T('poang'))+'</th>'+
       '<th class="n">'+esc(T('placering'))+'</th></tr>';
    grenar.forEach(g=>{
      h+='<tr><td>'+esc(GN[g]||g)+'</td><td class="n">'+p[g].toFixed(2)+'</td>'+
         '<td class="n muted">'+(rank[g]?esc(T('nrVarlden',{n:tusen(rank[g])})):'–')+'</td></tr>';
    });
    h+='</table></div><p class="formel">'+esc(T('poangForkl'))+'</p></div>';
  }

  // Förbundslänk: riktig adress om nationen finns i fis-forbund.js,
  // annars en färdig sökning – aldrig en trasig länk.
  const fb=(window.FIS_FORBUND||{})[nat];
  const forbundNamn=fb?fb.namn:(nat?nat+' ski association':'');
  const forbundLank=fb?fb.webb:('https://www.google.com/search?q='+
    encodeURIComponent((nat||'')+' national ski association alpine'));

  h+='<div class="card"><h3>'+esc(T('lankar'))+'</h3><div class="lankar" id="lankar">'+
     (bio?'<a href="'+esc(bio)+'" target="_blank" rel="noopener">📄 '+esc(T('fisBio'))+'</a>':'')+
     (nat?'<a href="'+esc(forbundLank)+'" target="_blank" rel="noopener">🏔 '+
        esc(forbundNamn)+'</a>':'')+
     '</div><p class="tom" id="egna">'+esc(T('laddar'))+'</p></div>';
  app.innerHTML=h;

  if(ARK===null) ARK=await hamtaArk();
  const egna=[...((window.FIS_PROFILER||{})[String(fis)]||[]), ...((ARK||{})[String(fis)]||[])]
    .filter(l=>l.adress&&saker(l.adress,l.typ));
  const box=document.getElementById('lankar'), txt=document.getElementById('egna');
  /* Uppmaningen ska stå oavsett om åkaren fyllt i något eller inte – den som
     redan lagt upp länkar vill också kunna ändra dem. */
  const uppmaning='<p class="lead" style="margin:12px 0 0">'+esc(T('dinSidaFraga'))+
    ' <a href="lagg-till.html">'+esc(T('dinSidaKnapp'))+'</a></p>';
  if(!egna.length){ txt.textContent=T('ingaEgna');
    txt.insertAdjacentHTML('afterend',uppmaning); return; }
  txt.remove();
  const sociala=egna.filter(l=>l.typ!=='sponsor');
  const sponsor=egna.filter(l=>l.typ==='sponsor');
  sociala.forEach(l=>{
    const t=TYPNAMN[l.typ]||['Länk','🔗'];
    box.insertAdjacentHTML('beforeend','<a href="'+esc(l.adress)+'" target="_blank" '+
      'rel="noopener nofollow">'+t[1]+' '+esc(l.namn||t[0])+'</a>');
  });
  if(sponsor.length){
    box.insertAdjacentHTML('afterend','<h3 style="margin-top:16px">'+esc(T('sponsorer'))+'</h3>'+
      '<div class="lankar">'+sponsor.map(l=>'<a href="'+esc(l.adress)+'" target="_blank" '+
      'rel="noopener nofollow">🤝 '+esc(l.namn||l.adress)+'</a>').join('')+'</div>');
  }
  box.insertAdjacentHTML('afterend',uppmaning);
}

/* ============ 9. Hämtning, uppdatering och routing ============ */
let timer=null, senaste=null, aktuell=null, aktivCodex=null;
const mapp=c=>'al'+String(c).replace(/\D/g,'').padStart(4,'0');
function statusText(t,live){
  const el=document.getElementById('status');
  if(el) el.innerHTML='<span class="dot'+(live?' on':'')+'"></span>'+esc(t);
}
async function laddaTavling(codex,forsta){
  const meta=KAL.find(r=>String(+r.codex)===String(+codex));
  if(forsta) document.getElementById('app').innerHTML=
    '<a class="back" href="#">'+esc(T('tillbaka'))+'</a>'+
    '<div class="card"><p class="muted">'+esc(T('hamtar'))+'</p></div>';
  try{
    const d=unserialize(await grab(mapp(codex),'main.xml'));
    aktuell=d;
    const a=analysera(d);
    window.__namn={}; window.__nat={};
    for(const f in a.akare||{}){
      window.__namn[f]=a.akare[f].efter.toUpperCase()+' '+a.akare[f].forn;
      window.__nat[f]=a.akare[f].nat;
    }
    ritaTavling(a,meta,codex);
    statusText(T('uppdaterad',{t:new Date().toLocaleTimeString(LOK())}),true);
  }catch(e){
    /* Har tävlingen en färdig resultatsida är det den man vill se, inte
       ett felmeddelande – skicka dit direkt. */
    const ark=(window.FIS_ARKIV||{});
    const traff=Object.keys(ark).find(n=>n.split('|')[0]===String(codex));
    if(traff){ location.href=ark[traff]; return; }
    document.getElementById('app').innerHTML='<a class="back" href="#">'+esc(T('tillbaka'))+'</a>'+
      '<div class="card"><p class="err">'+esc(T('ingenLive',{c:codex}))+'</p>'+
      '<p class="formel">'+esc(T('ingenLiveForkl'))+'</p></div>';
  }
}
async function puls(){
  if(!aktuell||!aktuell.live||!aktivCodex)return;
  try{
    const t=await grab(mapp(aktivCodex),'updt'+aktuell.live['1']+'.xml');
    if(t!==senaste){senaste=t;await laddaTavling(aktivCodex,false);}
    else statusText(T('oforandrad',{t:new Date().toLocaleTimeString(LOK())}),true);
  }catch(e){}
}
function rutt(){
  if(timer){clearInterval(timer);timer=null;}
  const hash=location.hash||'';
  let m=hash.match(/^#tavling\/(\d+)/);
  if(m){
    aktivCodex=m[1]; senaste=null; aktuell=null;
    laddaTavling(aktivCodex,true);
    timer=setInterval(puls,3000);
    window.scrollTo(0,0); return;
  }
  m=hash.match(/^#akare\/(\d+)(?:\/(\d*))?/);
  if(m){ ritaAkare(m[1],m[2]||''); window.scrollTo(0,0); return; }
  aktivCodex=null; ritaValjare(); window.scrollTo(0,0);
}
/* ============ 10. Lägg till på hemskärmen ============
   Android och Windows skickar ett eget installationslöfte som vi sparar och
   utlöser när användaren trycker. iPhone har ingen sådan knapp – där visar vi
   var man trycker i stället. Rutan syns bara i mobilen, bara när sidan inte
   redan är installerad, och bara en gång i månaden om man tackar nej. */
const INSTALL_NEJ='rp-install-nej';
let installLofte=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); installLofte=e; kanskeVisaInstall();
});
window.addEventListener('appinstalled',()=>{ taBortInstall(); });

const redanInstallerad=()=>
  (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||
  window.navigator.standalone===true;
const arMobil=()=>window.matchMedia&&window.matchMedia('(max-width: 820px)').matches;
const arIos=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)&&
  !/crios|fxios|edgios/i.test(navigator.userAgent);
function nyligenAvvisad(){
  try{
    const t=Number(localStorage.getItem(INSTALL_NEJ)||0);
    return t && (Date.now()-t) < 30*24*3600*1000;
  }catch(e){ return false; }
}
function taBortInstall(){
  const r=document.getElementById('install'); if(r) r.remove();
}
const DELAIKON='<svg class="delaikon" width="13" height="16" viewBox="0 0 13 16" '+
  'aria-hidden="true"><path d="M6.5 1.2 3.6 4.1M6.5 1.2 9.4 4.1M6.5 1.2v9" fill="none" '+
  'stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>'+
  '<path d="M2.2 7.4h-.4v7.4h9.4V7.4h-.4" fill="none" stroke="currentColor" '+
  'stroke-width="1.5" stroke-linecap="round"/></svg>';

function kanskeVisaInstall(){
  if(document.getElementById('install')) return;
  if(redanInstallerad()||!arMobil()||nyligenAvvisad()) return;
  const ios=arIos();
  if(!ios && !installLofte) return;          // annan webbläsare utan stöd
  const t=n=>TX('SPRAK_INSTALL',n);
  const ruta=document.createElement('div');
  ruta.id='install'; ruta.className='install';
  ruta.setAttribute('role','dialog');
  ruta.innerHTML=
    '<svg class="marke" width="34" height="34" viewBox="0 0 52 52" aria-hidden="true">'+
    '<circle cx="26" cy="26" r="25" fill="none" stroke="var(--sigill-ring)" stroke-width="1.6"/>'+
    '<circle cx="26" cy="26" r="21" fill="var(--sigill-disk)"/>'+
    '<path d="M12 33l7.5-11 5 7 6-9.5L38 33z" fill="var(--sigill-berg)"/>'+
    '<rect x="12" y="35.4" width="26" height="2" rx="1" fill="var(--sigill-dot)"/></svg>'+
    '<div class="txt"><b>'+esc(t('rubrik'))+'</b><span>'+
      (ios ? DELAIKON+' '+esc(t('ios')) : esc(t('android')))+
    '</span><div class="knappar">'+
      (ios?'':'<button class="ja" id="installJa">'+esc(t('knapp'))+'</button>')+
      '<button id="installNej">'+esc(t('senare'))+'</button>'+
    '</div></div>';
  document.body.appendChild(ruta);
  const nej=document.getElementById('installNej');
  nej.onclick=()=>{ try{localStorage.setItem(INSTALL_NEJ,String(Date.now()));}catch(e){}
                    taBortInstall(); };
  const ja=document.getElementById('installJa');
  if(ja) ja.onclick=async()=>{
    taBortInstall();
    if(!installLofte) return;
    installLofte.prompt();
    try{ await installLofte.userChoice; }catch(e){}
    installLofte=null;
  };
}
// vänta tills besökaren hunnit se vad sidan är innan vi frågar
setTimeout(kanskeVisaInstall, 4000);

window.addEventListener('hashchange',rutt);
document.documentElement.lang=SPR;
ritaSprakval();
ritaFot();
rutt();
</script>
